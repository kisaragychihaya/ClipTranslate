name: Build ClipTranslate Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 与参考仓库 kisaragychihaya/honor_8e5_ubl 同款方案：
      # setup-android@v4 + 指定 cmdline-tools 版本，再按需安装平台与构建工具。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliptranslate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
