name: Build ClipTranslate APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 与参考仓库 kisaragychihaya/honor_8e5_ubl 同款方案：
      # setup-android@v4 + 指定 cmdline-tools 版本，再按需安装平台与构建工具。
      # cmake;3.22.1 = AGP 里 externalNativeBuild.cmake.version 指定的版本（SDK 里必须
      # 有这一份才能编译 app/src/main/cpp）；ndk;27.3.13750724 = gradle 的 ndkVersion，
      # 该版本本来就是 ubuntu-24.04 镜像自带的默认 NDK，这一步通常直接命中缓存。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools cmake;3.22.1 ndk;27.3.13750724"
          log-accepted-android-sdk-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 普通 push / 手动触发只构建 debug 包（省一半构建时间，也足够 ADB 真机验证）；
      # 只有打 v* tag 才走 release 构建 + 签名 + GitHub Release。
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # debug 包用于 ADB 真机验证本地推理：debuggable 才能 run-as 把 GGUF 推进
      # /data/data/dev.cliptranslate/files/ 里，且不受 release 签名配置影响。
      # 发布 tag 时不构建 debug 包。
      - name: Build Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # 守卫：externalNativeBuild 失败/被跳过时 AGP 仍可能产出一个没有 .so 的 APK，
      # 那种包在真机上只会给出「推理库未内置」。这里直接让 CI 红掉，省一轮人工排查。
      # 顺便确认 OpenCL 的链接桩（libOpenCL.so）没有被误打进 APK：真机上那份必须是
      # /vendor/lib64 里高通自带的实现，打进来一个空桩会让 OpenCL 后端直接不可用。
      - name: Verify native library is packaged
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "--- $apk"
            if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libcliptranslate_jni.so"; then
              echo "::error::$apk 里没有 lib/arm64-v8a/libcliptranslate_jni.so（native 构建没跑或没被打包）"
              unzip -l "$apk" | grep "lib/" || true
              exit 1
            fi
            echo "OK: lib/arm64-v8a/libcliptranslate_jni.so"
            echo "--- lib/ 全部内容"
            unzip -l "$apk" | grep "lib/" || true
            for unwanted in libOpenCL.so libOpenCL.linkstub; do
              if unzip -l "$apk" | grep -q "lib/arm64-v8a/${unwanted}"; then
                echo "::error::$apk 里出现了 ${unwanted}（OpenCL 链接桩不该进包，运行时用设备 /vendor/lib64/libOpenCL.so）"
                exit 1
              fi
            done
            echo "OK: 没有多余的系统库副本"
            # NPU skel：必须是 assets/htp-skel/ 下的 5 个独立文件（运行时由 Kotlin 解压
            # 到 filesDir，fastrpc 只认真实文件路径，jniLibs 是 APK 内 mmap 读不了）。
            # 缺了只会让 NPU 选项不可用，不至于整个包不可用 —— 提示级。
            missing=""
            for v in 73 75 79 81 85; do
              if ! unzip -l "$apk" | grep -q "assets/htp-skel/libggml-htp-v${v}\.so"; then
                missing="$missing v${v}"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::warning::$apk 的 assets/htp-skel/ 里缺 skel:${missing}（NPU 会不可用）"
            else
              echo "OK: assets/htp-skel/ 5 个 skel 都在"
            fi
            if unzip -l "$apk" | grep -qE "lib/arm64-v8a/libggml-htp-"; then
              echo "::error::$apk 把 skel 打成 jniLibs 了（fastrpc 无法从 APK 内加载，必须走 assets/htp-skel）"
              exit 1
            fi
            echo "OK: skel 没被塞进 jniLibs"
            # 提示性检查：确认 OpenCL 后端真的被编进 .so 了（CMake 里若因为
            # find_package 没找到而静默关掉后端，这里能看出来）。不红，只警告。
            unzip -p "$apk" lib/arm64-v8a/libcliptranslate_jni.so > /tmp/cliptranslate_jni.so
            for marker in "ggml_opencl:" "ggml-hex:"; do
              if strings /tmp/cliptranslate_jni.so | grep -q "$marker"; then
                echo "OK: backend marker ${marker}"
              else
                echo "::warning::.so 里没有 ${marker} 字符串，对应后端可能没编进来"
              fi
            done
          done

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cliptranslate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: cliptranslate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # 打 v* tag 时自动发布 GitHub Release，挂上 Release APK。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cliptranslate-release-apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(ls *.apk | head -1)
          echo "attach: $apk"
          gh release create "${GITHUB_REF_NAME}" "$apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "模译 ${GITHUB_REF_NAME}" \
            --generate-notes
